name: Release Bals

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: meta
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          if ($content -match '(?m)^version\s*=\s*"([^"]+)"') {
            $ver = $Matches[1]
            "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "tag=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Detected Cargo.toml version: $ver (tag: v$ver)"
          } else {
            throw "Could not find version in Cargo.toml"
          }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked

      - name: Check if release tag already exists
        id: check_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ steps.meta.outputs.tag }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Release $tag already exists. Skipping release publish (bump version in Cargo.toml to publish a new release)."
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Release $tag does not exist yet. Will build and publish!"
          }
          exit 0

      - name: Build release binary
        if: steps.check_release.outputs.exists == 'false'
        run: cargo build --release --locked

      - name: Package release artifacts
        if: steps.check_release.outputs.exists == 'false'
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\bals.exe dist\bals.exe

          $zipPath = "dist\bals-v$ver-windows-x64.zip"
          Compress-Archive -Path dist\bals.exe, README.md -DestinationPath $zipPath -Force

          $exeHash = (Get-FileHash dist\bals.exe -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          @(
            "$exeHash  bals.exe"
            "$zipHash  bals-v$ver-windows-x64.zip"
          ) | Set-Content -Path "dist\bals-v$ver-windows-x64.sha256" -Encoding ascii

      - name: Publish GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          gh release create $tag `
            dist\bals.exe `
            "dist\bals-v$ver-windows-x64.zip" `
            "dist\bals-v$ver-windows-x64.sha256" `
            --title "Bals $tag" `
            --generate-notes
